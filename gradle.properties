jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # github.ref_name 是 tag 名，格式如 v2.7.1
      MOD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x ./gradlew

      - name: Build with Gradle
        # 去掉前缀 v，传入 mod_version 参数覆盖 gradle.properties 中的默认值
        run: ./gradlew clean build -Pmod_version=${MOD_VERSION#v}
